# Samba for the homeserver: Z: drive on the owner's laptop, tailnet only.
# Installed to /etc/samba/smb.conf. Second lock: the Samba password (smbpasswd -a palani).
[global]
   workgroup = WORKGROUP
   server string = homeserver
   security = user
   map to guest = never
   passdb backend = tdbsam

   # Only Tailscale addresses (IPv4 and IPv6) and the server itself may connect.
   hosts allow = 100.64.0.0/10 fd7a:115c:a1e0::/48 127.0.0.1 ::1
   hosts deny = ALL

   server min protocol = SMB3
   server smb encrypt = desired
   disable netbios = yes
   smb ports = 445

   # No printer sharing.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[Files]
   path = /home/palani/Files
   valid users = palani
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755

[Backups]
   path = /home/palani/Backups
   valid users = palani
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755
