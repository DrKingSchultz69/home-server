<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>homeserver</title>
<style>
/* Layout: one column; problem banner, resource meters, service tiles. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --ink: #121a26; --muted: #5d6879; --line: #d6dce5;
  --accent: #2459c8; --up: #17804c; --up-soft: #ddf2e6; --down: #c0352b; --down-soft: #fbe3e0;
  --planned: #7a8496; --planned-soft: #e9edf3; --meter: #2459c8; --meter-hot: #c0352b; --meter-warm: #b26b00;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #151b24; --ink: #e5eaf2; --muted: #95a0b3; --line: #262f3d;
    --accent: #7fa6ff; --up: #4fd18b; --up-soft: #12301f; --down: #ff7b70; --down-soft: #3b1715;
    --planned: #8a95a8; --planned-soft: #1d2430; --meter: #7fa6ff; --meter-hot: #ff7b70; --meter-warm: #f0b45c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
.wrap { max-width: 860px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font: 700 26px/1.2 var(--mono); letter-spacing: -0.01em; }
h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.who { color: var(--muted); font-size: 14px; }
.banner { border-radius: 10px; padding: 12px 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.banner.ok { background: var(--up-soft); color: var(--up); }
.banner.bad { background: var(--down-soft); color: var(--down); }
.banner.wait { background: var(--planned-soft); color: var(--muted); }
section { display: grid; gap: 10px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.meter { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meter .label { color: var(--muted); font-size: 14px; }
.meter .value { font: 700 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.meter .sub { color: var(--muted); font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--planned-soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--meter); transition: width .4s ease; }
.bar i.warm { background: var(--meter-warm); }
.bar i.hot { background: var(--meter-hot); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; color: inherit; text-decoration: none; min-width: 0; }
a.tile:hover, a.tile:focus-visible { border-color: var(--accent); outline: none; }
a.tile:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.tile .top { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--planned); }
.dot.up { background: var(--up); }
.dot.down { background: var(--down); }
.tile .name { font-weight: 700; }
.tile .state { margin-left: auto; font: 600 12px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--planned-soft); color: var(--planned); }
.tile .state.up { background: var(--up-soft); color: var(--up); }
.tile .state.down { background: var(--down-soft); color: var(--down); }
.tile .about { color: var(--muted); font-size: 14px; }
.tile .detail { font: 13px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.tile .open { color: var(--accent); font-size: 14px; font-weight: 600; }
.store { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.store .sub { color: var(--muted); font: 13px var(--mono); }
.folders { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.folders li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.folders .fname { font: 14px var(--mono); overflow-wrap: anywhere; min-width: 0; }
.folders .fsize { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.folders .bar { grid-column: 1 / -1; height: 6px; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>homeserver</h1>
    <span class="who" id="who">Connecting…</span>
  </header>

  <div class="banner wait" id="banner">Checking services…</div>

  <section id="resources" hidden>
    <h2>Resources</h2>
    <div class="meters">
      <div class="meter"><div class="row"><span class="label">CPU</span><span class="value" id="cpu">–</span></div><div class="bar"><i id="cpu-bar"></i></div><div class="sub" id="cpu-sub">&nbsp;</div></div>
      <div class="meter"><div class="row"><span class="label">Memory</span><span class="value" id="mem">–</span></div><div class="bar"><i id="mem-bar"></i></div><div class="sub" id="mem-sub">&nbsp;</div></div>
      <div class="meter"><div class="row"><span class="label">Disk</span><span class="value" id="disk">–</span></div><div class="bar"><i id="disk-bar"></i></div><div class="sub" id="disk-sub">&nbsp;</div></div>
    </div>
  </section>

  <section id="storage" hidden>
    <h2>Storage</h2>
    <div class="store">
      <ol class="folders" id="folders"></ol>
      <div class="sub" id="storage-sub">&nbsp;</div>
    </div>
  </section>

  <section>
    <h2>Services</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <footer id="footer">Updates every 5 seconds while this page is open.</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const gb = (b) => (b / 1024 ** 3).toFixed(1) + " GB";
const ago = (t, now) => { if (!t) return "not checked yet"; const s = Math.max(0, Math.round((now - t) / 1000)); return s < 60 ? `checked ${s}s ago` : `checked ${Math.round(s / 60)} min ago`; };
const level = (pct) => (pct >= 90 ? "hot" : pct >= 75 ? "warm" : "");

function meter(id, pct, text, sub) {
  $(id).textContent = text;
  const bar = $(id + "-bar");
  bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
  bar.className = level(pct);
  $(id + "-sub").textContent = sub;
}

function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

function tile(s, now) {
  const state = s.planned ? "planned" : s.up === true ? "up" : s.up === false ? "down" : "checking";
  const el = document.createElement(s.link && !s.planned ? "a" : "div");
  el.className = "tile";
  if (el.tagName === "A") el.href = s.link;
  const top = document.createElement("div"); top.className = "top";
  const dot = document.createElement("span"); dot.className = "dot " + (state === "up" || state === "down" ? state : "");
  const name = document.createElement("span"); name.className = "name"; name.textContent = s.name;
  const badge = document.createElement("span"); badge.className = "state " + (state === "up" || state === "down" ? state : ""); badge.textContent = { up: "Up", down: "Down", planned: "Not set up", checking: "Checking" }[state];
  top.append(dot, name, badge);
  const about = document.createElement("div"); about.className = "about"; about.textContent = s.about;
  el.append(top, about);
  if (!s.planned) {
    const detail = document.createElement("div"); detail.className = "detail"; detail.textContent = `${s.detail} · ${ago(s.checkedAt, now)}`;
    el.append(detail);
  }
  if (el.tagName === "A") { const open = document.createElement("div"); open.className = "open"; open.textContent = "Open →"; el.append(open); }
  return el;
}

function render(data) {
  $("who").textContent = data.viewer.role === "owner" ? `Signed in as ${data.viewer.name}` : `Hi ${data.viewer.name}`;
  const live = data.services.filter((s) => !s.planned);
  const down = live.filter((s) => s.up === false);
  const banner = $("banner");
  if (down.length) { banner.className = "banner bad"; banner.textContent = `Problem: ${down.map((s) => s.name).join(", ")} ${down.length === 1 ? "is" : "are"} down.`; }
  else if (live.length && live.every((s) => s.up === true)) { banner.className = "banner ok"; banner.textContent = "Everything is running."; }
  else if (!live.length) { banner.className = "banner wait"; banner.textContent = "Nothing is set up for you yet."; }
  else { banner.className = "banner wait"; banner.textContent = "Checking services…"; }

  $("tiles").replaceChildren(...data.services.map((s) => tile(s, data.now)));

  const r = data.resources;
  $("resources").hidden = !r;
  if (r) {
    meter("cpu", r.cpu ?? 0, r.cpu == null ? "–" : r.cpu + "%", `load ${r.load.toFixed(2)} · up ${uptime(r.uptime)}`);
    const memPct = Math.round((100 * r.memory.used) / r.memory.total);
    meter("mem", memPct, memPct + "%", `${gb(r.memory.used)} of ${gb(r.memory.total)}`);
    const diskPct = Math.round((100 * r.disk.used) / r.disk.total);
    meter("disk", diskPct, diskPct + "%", `${gb(r.disk.used)} of ${gb(r.disk.total)}`);
  }
  renderStorage(data.storage, data.resources, data.now);
  $("footer").textContent = "Updates every 5 seconds while this page is open.";
}

const size = (b) => (b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(1) + " GB" : (b / 1024 ** 2).toFixed(0) + " MB");
let storageShownAt = null;
function renderStorage(st, r, now) {
  const box = $("storage");
  if (!r) { box.hidden = true; return; }
  box.hidden = false;
  if (!st) { $("folders").replaceChildren(); $("storage-sub").textContent = "First measurement runs a minute after the dashboard starts."; return; }
  const mins = Math.round((now - st.measuredAt) / 60000);
  $("storage-sub").textContent = `Measured ${mins < 1 ? "just now" : mins + " min ago"} · refreshed hourly`;
  if (storageShownAt === st.measuredAt) return; // only rebuild when there is a new measurement
  storageShownAt = st.measuredAt;
  const max = Math.max(...st.items.map((i) => i.bytes), 1);
  $("folders").replaceChildren(...st.items.map((i) => {
    const li = document.createElement("li");
    const name = document.createElement("span"); name.className = "fname"; name.textContent = i.name;
    const sz = document.createElement("span"); sz.className = "fsize"; sz.textContent = size(i.bytes);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = Math.max(1, Math.round((100 * i.bytes) / max)) + "%";
    bar.append(fill); li.append(name, sz, bar); return li;
  }));
}

let timer = null;
async function refresh() {
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    if (!res.ok) throw new Error(await res.text());
    render(await res.json());
  } catch (err) {
    $("banner").className = "banner bad";
    $("banner").textContent = "Can't reach the dashboard. Check that Tailscale is on.";
    $("footer").textContent = String(err.message || err);
  }
}
function start() { if (!timer) { refresh(); timer = setInterval(refresh, 5000); } }
function stop() { clearInterval(timer); timer = null; }
document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
start();
</script>
</body>
</html>
